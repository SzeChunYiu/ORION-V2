name: ME Foundation integration custody and replay
on:
  pull_request:
    paths:
      - 'research/machine-epistemics-theory/**'
      - 'tests/unit/test_me_foundation*'
      - 'tests/unit/test_meg_foundation*'
      - 'tests/unit/test_machine_epistemics_foundation*'
      - 'tests/unit/test_me_causal_verifier_v1.py'
      - '.github/workflows/me-*.yml'
  push:
    branches: [main]
    paths:
      - 'research/machine-epistemics-theory/**'
      - 'tests/unit/test_me_foundation*'
      - 'tests/unit/test_meg_foundation*'
      - 'tests/unit/test_machine_epistemics_foundation*'
      - 'tests/unit/test_me_causal_verifier_v1.py'
      - '.github/workflows/me-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: me-foundation-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  custody-and-finite-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.3.5
      - name: Verify preserved sources and replay each native package in its own process
        run: >-
          python research/machine-epistemics-theory/foundation_integration_v1/check_integration.py
          --replay > "$RUNNER_TEMP/foundation-integration-replay.json"
      - name: Check that replay did not mutate tracked evidence
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-integration-${{ matrix.python-version }}
          path: ${{ runner.temp }}/foundation-integration-replay.json
