name: solver-reference-checks

on:
  pull_request:
    paths:
      - "research/reference_models/solver_policy_v0.py"
      - "tests/fixtures/solver_lifecycle_cases_v0.json"
      - "tests/reference_models/test_solver_policy_v0.py"
      - "tests/reference_models/conftest.py"
      - ".github/workflows/solver-reference-checks.yml"
  push:
    branches:
      - "research/**"
    paths:
      - "research/reference_models/solver_policy_v0.py"
      - "tests/fixtures/solver_lifecycle_cases_v0.json"
      - "tests/reference_models/test_solver_policy_v0.py"
      - "tests/reference_models/conftest.py"
      - ".github/workflows/solver-reference-checks.yml"

permissions:
  contents: read

jobs:
  solver-known-answer-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile solver reference model
        run: python -m py_compile research/reference_models/solver_policy_v0.py
      - name: Run solver known-answer tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/reference_models/test_solver_policy_v0.py

# Passing this workflow establishes only consistency of synthetic V0 research
# cases. It grants no V2 implementation, scientific or V1-freeze authority.
