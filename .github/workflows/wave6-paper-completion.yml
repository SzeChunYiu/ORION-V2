name: wave6-paper-completion

on:
  push:
    branches:
      - research/wave6-contraction-closure-20260827
  pull_request:
    paths:
      - "papers/**"
      - "research/closure/PAPER_COMPLETION_PROGRESS_RECEIPT_V3.json"
      - "src/orion_v2/paper_completion.py"
      - "tests/unit/test_paper_completion_wave6.py"
      - ".github/workflows/wave6-paper-completion.yml"

jobs:
  paper-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile completion semantics
        run: python -m py_compile src/orion_v2/paper_completion.py

      - name: Run paper-completion unit tests
        run: python -m pytest -q tests/unit/test_paper_completion_wave6.py

      - name: Parse frozen portfolio claim ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("papers/pipeline/PORTFOLIO_CLAIM_EVIDENCE_LEDGER_V1.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "PRE_OUTCOME_FROZEN"
          assert data["authority"]["grants_submission_readiness"] is False
          assert data["authority"]["grants_journal_acceptance"] is False
          assert data["portfolio_terminal"]["field_founded"] is False
          assert data["portfolio_terminal"]["submission_ready_R4"] == []
          assert data["portfolio_terminal"]["top_tier_submission_ready"] == []
          assert data["portfolio_terminal"]["second_tier_submission_ready"] == []
          assert len(data["papers"]) >= 8
          for paper in data["papers"]:
              assert paper["claims"]
              for claim in paper["claims"]:
                  assert claim["claim_id"]
                  assert claim["required_evidence_units"]
                  assert claim["hard_falsifier"]
          PY

      - name: Parse post-execution evidence delta and V3 completion receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          delta = json.loads(Path("papers/pipeline/PORTFOLIO_CLAIM_EVIDENCE_LEDGER_V2_POST_EXECUTION_DELTA.json").read_text())
          assert delta["status"] == "POST_E20_E40_E50_EVIDENCE_BOUND__CONFIRMATORY_RESULTS_OPEN"
          e20 = delta["evidence_bound"]["E20"]
          assert e20["classification"] == "PROTECTED_VALID_UNDERPOWERED_PILOT"
          assert e20["arms"]["F2_ORION_METABOLIC_FULL"]["successes"] == 1
          assert e20["arms"]["F0_PARENT_FEDERATION"]["successes"] == 1
          assert e20["arms"]["SIMPLE_DIRECT"]["successes"] == 2
          assert e20["arms"]["SAME_MODEL_REFLECTION"]["successes"] == 2
          assert e20["comparisons"]["interpretation"] == "NO_F2_SUPERIORITY_PILOT_UNDERPOWERED"
          assert e20["primary_result_changed_by_audit"] is False
          assert delta["portfolio_terminal"]["manuscripts_scientifically_complete_R3"] == []
          assert delta["portfolio_terminal"]["submission_ready_R4"] == []
          assert delta["portfolio_terminal"]["top_tier_submission_ready"] == []
          assert delta["portfolio_terminal"]["field_founded"] is False
          assert all(value is False for value in delta["authority"].values())

          receipt = json.loads(Path("research/closure/PAPER_COMPLETION_PROGRESS_RECEIPT_V3.json").read_text())
          assert receipt["status"] == "FIRST_PROTECTED_F2_COMPARISON_BOUND__NO_R3_PAPER_YET"
          assert receipt["evidence_state"]["E20"] == "COMPLETE_VALID_ADVERSE_UNDERPOWERED_PILOT"
          assert receipt["portfolio_counts"]["scientifically_complete_R3_or_above"] == 0
          assert receipt["portfolio_counts"]["submission_ready_R4"] == 0
          assert receipt["portfolio_counts"]["top_tier_submission_ready"] == 0
          assert receipt["foundation_state"]["field_founded"] is False
          assert all(value is False for value in receipt["authority"].values())
          PY

      - name: Check required manuscript and post-result surfaces
        run: |
          test -f papers/drafts/FLAGSHIP_MACHINE_EPISTEMICS_MANUSCRIPT_V7_TOP_TIER_PRE_EVIDENCE.md
          test -f papers/drafts/P_A_STRUCTURAL_DONOR_DISCOVERY_MANUSCRIPT_V3_TOP_TIER_PRE_RESULTS.md
          test -f papers/drafts/P_B_CONTEXT_RELATIVE_RELATIONS_MANUSCRIPT_V3_TOP_TIER_PRE_RESULTS.md
          test -f papers/drafts/P_C_OBLIGATION_DRIVEN_SOLVER_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md
          test -f papers/drafts/P_D_DEPENDENCE_AWARE_EVIDENCE_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md
          test -f papers/drafts/P_E_FRONTIER_OPPORTUNITY_DISCOVERY_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md
          test -f papers/drafts/P_F_MACHINE_NATIVE_SCIENTIFIC_INTELLIGENCE_MANUSCRIPT_V1_TOP_TIER_PRE_RESULTS.md
          test -f papers/prospectuses/P_G_SCIENTIFIC_WARRANT_FACTORISATION_PROSPECTUS_V0.md
          test -f papers/pipeline/TOP_TIER_PAPER_COMPLETION_PROGRAMME_V1.md
          test -f papers/results/P_C_E20_PILOT_RESULT_BLOCK_V1.md
          test -f papers/results/FLAGSHIP_E20_E40_E50_BOUNDARY_RESULT_BLOCK_V1.md
          test -f papers/iteration/ROUND_17_POST_E20_E40_E50_TOP_TIER_EDITOR_SYNTHESIS_V1.md

      - name: Enforce adverse pilot in top-tier evidence narrative
        run: |
          python - <<'PY'
          from pathlib import Path

          pc = Path("papers/results/P_C_E20_PILOT_RESULT_BLOCK_V1.md").read_text(encoding="utf-8").casefold()
          flagship = Path("papers/results/FLAGSHIP_E20_E40_E50_BOUNDARY_RESULT_BLOCK_V1.md").read_text(encoding="utf-8").casefold()
          round17 = Path("papers/iteration/ROUND_17_POST_E20_E40_E50_TOP_TIER_EDITOR_SYNTHESIS_V1.md").read_text(encoding="utf-8").casefold()
          required = ("1/3", "2/3", "underpowered", "superiority")
          for text in (pc, flagship, round17):
              assert all(token in text for token in required)
          # Check scientific meaning, not brittle exact prose/capitalization.
          assert "does not support universal activation" in pc
          assert "did not show an advantage" in flagship
          assert "f2_superiority = not_established" in round17
          assert "no_r3_paper_yet" in round17
          PY

      - name: Enforce honest manuscript terminals
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("papers/drafts/FLAGSHIP_MACHINE_EPISTEMICS_MANUSCRIPT_V7_TOP_TIER_PRE_EVIDENCE.md"),
              Path("papers/drafts/P_A_STRUCTURAL_DONOR_DISCOVERY_MANUSCRIPT_V3_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/drafts/P_B_CONTEXT_RELATIVE_RELATIONS_MANUSCRIPT_V3_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/drafts/P_C_OBLIGATION_DRIVEN_SOLVER_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/drafts/P_D_DEPENDENCE_AWARE_EVIDENCE_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/drafts/P_E_FRONTIER_OPPORTUNITY_DISCOVERY_MANUSCRIPT_V4_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/drafts/P_F_MACHINE_NATIVE_SCIENTIFIC_INTELLIGENCE_MANUSCRIPT_V1_TOP_TIER_PRE_RESULTS.md"),
              Path("papers/prospectuses/P_G_SCIENTIFIC_WARRANT_FACTORISATION_PROSPECTUS_V0.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              assert "TOP_TIER_SUBMISSION_READY = NO" in text or "SUBMISSION_READY_R4 = FALSE" in text
              assert "Honest terminal" in text or "Current terminal" in text
          PY
