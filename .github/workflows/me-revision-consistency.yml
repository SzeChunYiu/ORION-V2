name: ME revision consistency
on:
  pull_request:
    paths:
      - 'research/machine-epistemics-theory/revision_consistency_v1/**'
      - '.github/workflows/me-revision-consistency.yml'
  push:
    branches: [main, research/me-revision-consistency-20260904]
    paths:
      - 'research/machine-epistemics-theory/revision_consistency_v1/**'
      - '.github/workflows/me-revision-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: me-revision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact calculation, tests and complete source bindings
        run: |
          D=research/machine-epistemics-theory/revision_consistency_v1
          python "$D/verify_package.py" --verify
          python "$D/verify_package.py" --selftest
      - name: Fresh-process and optimized-mode replay
        run: |
          D=research/machine-epistemics-theory/revision_consistency_v1
          PYTHONHASHSEED=1 python "$D/study.py" --verify "$D/RESULT.json" > /tmp/me-r1.json
          PYTHONHASHSEED=37 python -O "$D/study.py" --verify "$D/RESULT.json" > /tmp/me-r2.json
          cmp /tmp/me-r1.json /tmp/me-r2.json
          python -O "$D/verify_package.py" --verify
          git diff --exit-code
  repository-regression:
    needs: exact-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install repository test tooling and record versions
        run: |
          python -m pip install -e . pytest
          python -m pip freeze
      - name: Full repository unit regression (no exclusions)
        run: python -m pytest -q tests/unit --junitxml=/tmp/me-full-repository.xml
      - name: No tracked result mutation
        run: git diff --exit-code
