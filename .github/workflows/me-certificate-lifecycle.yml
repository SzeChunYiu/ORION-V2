name: me-certificate-lifecycle
on:
  pull_request:
    paths:
      - 'research/machine-epistemics-theory/certificate_lifecycle_v1/**'
      - '.github/workflows/me-certificate-lifecycle.yml'
  push:
    paths:
      - 'research/machine-epistemics-theory/certificate_lifecycle_v1/**'
      - '.github/workflows/me-certificate-lifecycle.yml'
permissions:
  contents: read
jobs:
  exact-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-04
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact calibration, applied mutants and archived source bindings
        working-directory: research/machine-epistemics-theory/certificate_lifecycle_v1
        run: |
          python -m py_compile reference.py test_reference.py check.py
          python check.py
