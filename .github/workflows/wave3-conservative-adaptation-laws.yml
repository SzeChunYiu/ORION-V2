name: wave3-conservative-adaptation-laws

on:
  pull_request:
    paths:
      - "src/orion_v2/**"
      - "tests/unit/**"
      - "research/generalization/**"
      - "research/machine-specs/**"
      - "papers/WAVE_03_PROGRAMME_DELTA_V0.md"
      - ".github/workflows/wave3-conservative-adaptation-laws.yml"
  push:
    branches:
      - "research/wave3-conservative-adaptation-calculus-20260827"
    paths:
      - "src/orion_v2/**"
      - "tests/unit/**"
      - "research/generalization/**"
      - "research/machine-specs/**"
      - ".github/workflows/wave3-conservative-adaptation-laws.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-law-and-transport-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile reference modules
        run: python -m compileall -q src/orion_v2
      - name: Run full unit suite
        run: python -m pytest tests/unit
      - name: Validate machine schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("research/machine-specs").glob("*.json"))
          if not paths:
              raise SystemExit("no machine schemas found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY
