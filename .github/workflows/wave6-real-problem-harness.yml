name: wave6-real-problem-harness

on:
  push:
    branches:
      - research/wave6-contraction-closure-20260827
    paths:
      - "src/orion_v2/knowledge_metabolism.py"
      - "scripts/run_orion_real_problem_suite.py"
      - "scripts/materialize_orion_solver_workspaces.py"
      - "research/experiments/ORION_REAL_PROBLEM_SUITE_V1.json"
      - "tests/unit/test_knowledge_metabolism_wave6.py"
      - "tests/unit/test_real_problem_suite_runner_wave6.py"
      - ".github/workflows/wave6-real-problem-harness.yml"
  pull_request:
    paths:
      - "src/orion_v2/knowledge_metabolism.py"
      - "scripts/run_orion_real_problem_suite.py"
      - "scripts/materialize_orion_solver_workspaces.py"
      - "research/experiments/ORION_REAL_PROBLEM_SUITE_V1.json"
      - "tests/unit/test_knowledge_metabolism_wave6.py"
      - "tests/unit/test_real_problem_suite_runner_wave6.py"
      - ".github/workflows/wave6-real-problem-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ORION and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile lifecycle and runners
        run: |
          python -m py_compile src/orion_v2/knowledge_metabolism.py
          python -m py_compile scripts/run_orion_real_problem_suite.py
          python -m py_compile scripts/materialize_orion_solver_workspaces.py

      - name: Run focused reference tests
        run: |
          python -m pytest -q \
            tests/unit/test_knowledge_metabolism_wave6.py \
            tests/unit/test_real_problem_suite_runner_wave6.py

      - name: Validate frozen real-problem manifest
        run: |
          python scripts/run_orion_real_problem_suite.py validate

      - name: Enforce non-authorizing experiment state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path("research/experiments/ORION_REAL_PROBLEM_SUITE_V1.json").read_text()
          )
          assert registry["status"] == "PROSPECTIVE_PROTOCOL_NO_RESULTS"
          assert all(value is False for value in registry["authority"].values())
          assert "F2_ORION_METABOLIC_FULL" in {
              item["arm_id"] for item in registry["arms"]
          }
          assert {
              "bugsinpy",
              "causalbench",
              "matbench_discovery",
          } <= {item["benchmark_id"] for item in registry["benchmarks"]}
          PY

      - name: Assert no result or publication promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(
              Path(
                  "papers/verification/KNOWLEDGE_METABOLISM_CLAIM_EXPERIMENT_LEDGER_V1.json"
              ).read_text()
          )
          assert ledger["status"] == "OPEN_NO_PROTECTED_RESULTS"
          assert all(value is False for value in ledger["authority"].values())
          assert not any(
              item["current_terminal"] == "SUBMISSION_READY"
              for item in ledger["claims"]
          )
          PY
