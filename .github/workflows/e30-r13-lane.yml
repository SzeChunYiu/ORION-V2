name: e30-r13-lane

on:
  push:
    branches:
      - main
    paths: &r13paths
      - "research/experiments/e30-r13/**"
      - "tests/unit/test_e30_r13_lane.py"
      - "scripts/orion_claude_arms.py"
      - "research/experiments/e30-r12/e30_r12_analysis.py"
      - "research/experiments/pc-r6/pc_r6_fullreg_eval.py"
      - "research/experiments/results/issue45/e30-r11/drivers/e30_r11_arm_eval_frozen_lane.py"
      - "scripts/analyze_orion_real_problem_results.py"
      - ".github/workflows/e30-r13-lane.yml"
  pull_request:
    paths: *r13paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r13-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ORION and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile the R13 lane and everything it imports
        run: |
          python -m py_compile research/experiments/e30-r13/e30_r13_analysis.py
          python -m py_compile research/experiments/e30-r13/e30_r13_fullreg_eval.py
          python -m py_compile research/experiments/e30-r13/e30_r13_budget_note.py
          python -m py_compile research/experiments/e30-r13/e30_r13_channel_calibration.py
          python -m py_compile research/experiments/e30-r12/e30_r12_analysis.py
          python -m py_compile research/experiments/pc-r6/pc_r6_fullreg_eval.py
          python -m py_compile scripts/analyze_orion_real_problem_results.py
          python -m py_compile scripts/orion_claude_arms.py
          for f in research/experiments/e30-r13/sbatch/*.sbatch \
                   research/experiments/e30-r13/sbatch/*.sh; do bash -n "$f"; done

      - name: Run the E30-R13 lane tests
        run: |
          python -m pytest -q tests/unit/test_e30_r13_lane.py

      - name: The E30-R12 lane still passes under the shared arms change
        run: |
          python -m pytest -q tests/unit/test_e30_r12_lane.py tests/unit/test_orion_claude_arms_wave6.py

      - name: The design is registered, prospective, and carries no outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          design = json.loads(Path("research/experiments/e30-r13/"
                                   "E30_R13_CHANNEL_CONTRACT_RERUN_DESIGN_V1.json").read_text())
          assert design["status"] == "PROSPECTIVE_REGISTERED_DESIGN_NO_RESULTS"
          assert design["authority"] == {
              "grants_scientific_truth": False, "grants_field_status": False,
              "grants_supertheory_status": False, "grants_publication_readiness": False,
              "parent_sufficiency_is_valid_terminal": True,
              "no_arm_separation_is_valid_terminal": True}
          rel = design["relationship_to_earlier_runs"]
          assert rel["r11_served_model"] == "INFERRED_NOT_VERIFIED"
          assert rel["comparison_to_r11"] == "DESCRIPTIVE_ONLY"
          assert rel["r12_read_no_endpoint"] is True
          assert rel["r12_completed_envelopes_pooled_into_r13"] is False
          text = json.dumps(design)
          for forbidden in ("observed_", "measured_success", "result_", "p_value"):
              assert forbidden not in text, forbidden
          print("design freeze intact")
          PY

      - name: The registered budget is the derived budget, and the contract is the dispatched contract
        run: |
          python - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("arms", "scripts/orion_claude_arms.py")
          arms = importlib.util.module_from_spec(spec); spec.loader.exec_module(arms)

          design = json.loads(Path("research/experiments/e30-r13/"
                                   "E30_R13_CHANNEL_CONTRACT_RERUN_DESIGN_V1.json").read_text())
          note = json.loads(Path("research/experiments/e30-r13/results/"
                                 "E30_R13_BUDGET_NOTE_V1.json").read_text())

          contract = design["model_binding"]["request_body_contract"]
          assert contract["contract_id"] in arms.CHANNEL_CONTRACTS, contract["contract_id"]
          assert contract["extra_body"] == arms.CHANNEL_CONTRACTS[contract["contract_id"]]
          assert contract["system"] == arms.ARM_SYSTEM_PROMPT
          assert contract["contract_sha256"] == arms.channel_contract_sha256(contract["contract_id"])

          derivation = note["registered_contract"]["derivation"]
          assert note["registered_contract"]["contract_id"] == contract["contract_id"]
          assert derivation["status"] == "DERIVED", derivation
          registered = design["execution_lane_contract"]["per_call_output_token_cap"]
          assert registered == derivation["registered_per_call_max_tokens"], (
              registered, derivation["registered_per_call_max_tokens"])
          # The campaign is 1080 model calls; a design that costs 480 has costed envelopes.
          assert note["campaign_arithmetic"]["total_model_calls"] == 1080
          assert design["execution_lane_contract"]["total_model_calls"] == 1080
          print("budget derived =", registered, "over", derivation["calls_measured"], "measured calls")
          PY

      - name: Frozen terminal archives are untouched by this PR
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD -- \
            research/experiments/results/issue45/e30-r11 \
            research/experiments/results/issue45/e60-r1-component-ablation \
            research/experiments/results/issue45/pc-r6 \
            research/experiments/pc-r6 \
            research/experiments/e30-r12 || true)
          if [ -n "$CHANGED" ]; then
            echo "R13 must not modify frozen terminal archives:"; echo "$CHANGED"; exit 1
          fi
          echo "frozen archives untouched"
