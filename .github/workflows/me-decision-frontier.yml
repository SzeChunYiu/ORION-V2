name: ME decision frontier exact calibration
on:
  pull_request:
    paths:
      - 'research/machine-epistemics-theory/decision_frontier_v1/**'
      - '.github/workflows/me-decision-frontier.yml'
  push:
    branches: [main]
    paths:
      - 'research/machine-epistemics-theory/decision_frontier_v1/**'
      - '.github/workflows/me-decision-frontier.yml'
permissions:
  contents: read
concurrency:
  group: me-decision-frontier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finite-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Scoped unit and hostile tests (not whole-repository verification)
        working-directory: research/machine-epistemics-theory/decision_frontier_v1
        run: python -m unittest -v test_frontier
      - name: Exact receipt replay and source-byte binding
        working-directory: research/machine-epistemics-theory/decision_frontier_v1
        run: python run_checks.py --verify
