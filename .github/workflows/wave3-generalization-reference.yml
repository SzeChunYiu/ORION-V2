name: wave3-generalization-reference

on:
  pull_request:
    paths:
      - "src/orion_v2/**"
      - "tests/unit/**"
      - "research/generalization/**"
      - "research/wave3/**"
      - "research/machine-specs/**"
      - ".github/workflows/wave3-generalization-reference.yml"
  push:
    branches:
      - "research/wave3-generalized-epistemic-dynamics-20260827"

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile package
        run: python -m compileall -q src/orion_v2
      - name: Run all unit and known-answer tests
        run: python -m pytest -q
      - name: Parse research JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('research').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('tests').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('JSON_PARSE_PASS')
          PY
      - name: Authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ('grants_scientific_truth = True', 'grants_novelty = True')
          for path in Path('src/orion_v2').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'forbidden authority token in {path}: {token}')
          print('AUTHORITY_BOUNDARY_PASS')
          PY
